<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Assessment · Hitbullseye</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/polish.css">
<style>
  .test-bar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
  .test-bar .in{max-width:1180px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .timer{display:flex;align-items:center;gap:9px;font-family:'Plus Jakarta Sans';font-weight:800;font-size:19px;color:var(--ink);
    background:var(--line-2);padding:8px 16px;border-radius:12px}
  .timer.low{background:var(--err-bg);color:var(--err)}
  .timer svg{width:18px;height:18px;color:var(--muted)}
  .q-grid{display:grid;grid-template-columns:1fr 268px;gap:22px;align-items:start;margin-top:22px}
  .opt{display:flex;gap:13px;align-items:flex-start;border:1.5px solid var(--line);border-radius:var(--r-md);
    padding:15px 17px;margin-bottom:11px;cursor:pointer;background:#fcfdff;transition:.15s;font-size:14.5px}
  .opt:hover{border-color:#cfdaea;background:#fff}
  .opt.sel{border-color:var(--brand);background:rgba(var(--brand-rgb),.05);box-shadow:var(--ring)}
  .opt input{margin-top:3px;accent-color:var(--brand);width:17px;height:17px;flex:none}
  .palette{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
  .code-wrap{border:1.5px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:#0b1630}
  .code-wrap .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:#121d3a;color:#a9b8d8;font-size:12px}
  .code-wrap textarea{display:block;width:100%;min-height:260px;border:0;outline:0;resize:vertical;padding:14px 16px;background:#0b1630;color:#e6edff;
    font:13.5px/1.6 ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;tab-size:2}
  .run-out{margin-top:12px;display:grid;gap:6px}
  .run-row{display:flex;gap:10px;align-items:flex-start;font:12.5px/1.5 ui-monospace,Consolas,monospace;padding:8px 10px;border-radius:9px;background:var(--line-2)}
  .run-row.ok{background:var(--ok-bg);color:var(--ok)} .run-row.bad{background:var(--err-bg);color:var(--err)}
  .ex{font:13px/1.6 ui-monospace,Consolas,monospace;background:var(--line-2);border-radius:9px;padding:10px 12px;margin:-6px 0 16px;color:var(--ink)}
  .pal-sec{grid-column:1/-1;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .pal{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer;
    font-weight:700;font-size:13.5px;color:var(--body);transition:.15s}
  .pal:hover{border-color:var(--brand)}
  .pal.ans{background:var(--ok-bg);border-color:#bfe8d3;color:var(--ok)}
  .pal.cur{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:var(--ring)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}
  .legend i{width:11px;height:11px;border-radius:4px;display:inline-block;margin-right:5px;vertical-align:-1px}
  @media(max-width:900px){ .q-grid{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="demo-strip"><b>DEMO PROTOTYPE</b> · not a live university portal · please do not enter real personal details</div>

<div class="test-bar">
  <div class="in">
    <span class="logo-plate" style="min-height:44px;padding:6px 12px"><img id="lg" src="" alt=""></span>
    <div class="grow">
      <div style="font-weight:700;color:var(--ink);font-size:14.5px" id="tName"></div>
      <div class="xs mut" id="tSub"></div>
    </div>
    <div class="timer" id="timer"></div>
    <button class="btn" onclick="T.submit(false)">Submit test</button>
  </div>
</div>

<main class="wrap" style="padding-bottom:60px">
  <div class="q-grid">

    <section class="card">
      <div class="row-b" style="margin-bottom:6px">
        <span class="badge brand" id="qSec"></span>
        <span class="sm mut" id="qNum"></span>
      </div>
      <h2 style="font-size:19px;line-height:1.45;margin:10px 0 20px" id="qText"></h2>
      <div id="opts"></div>

      <div class="divider"></div>
      <div class="row-b">
        <button class="btn btn-ghost" onclick="T.go(-1)">Previous</button>
        <div class="row" style="gap:10px">
          <button class="btn btn-ghost" onclick="T.clear()">Clear answer</button>
          <button class="btn" onclick="T.go(1)">Save &amp; next</button>
        </div>
      </div>
    </section>

    <aside class="card card-pad-s">
      <h3 style="font-size:14.5px;margin-bottom:14px">Question palette</h3>
      <div class="palette" id="pal"></div>
      <div class="legend">
        <span><i style="background:var(--ok-bg);border:1px solid #bfe8d3"></i>Answered</span>
        <span><i style="background:#fff;border:1px solid var(--line)"></i>Not answered</span>
      </div>
      <div class="divider"></div>
      <div class="kv"><span>Answered</span><b id="cAns">0</b></div>
      <div class="kv"><span>Remaining</span><b id="cRem">0</b></div>
      <button class="btn btn-block" style="margin-top:14px" onclick="T.submit(false)">Submit test</button>
      <p class="xs mut center" style="margin-top:10px">Prototype: a short version of the real paper. Your time on every question is recorded for the report.</p>
    </aside>

  </div>
</main>

<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/hb-engine.js"></script>
<script src="js/hb-analytics.js"></script>
<script>
var T = (function(){

  var s = hbeSession();
  if(!s || s.role !== "student"){ location.href = "login.html?next=test.html"; return {}; }

  var cfg = hbeGetConfig();
  var st  = hbeStudentById(s.id);
  var c   = cfg.colleges[st.collegeId];
  hbeApplyTheme(c);

  /* which assessment? ?test=<id>, else the first one this student may see */
  var mine = hbeTestsFor(c, st);
  var T = hbeTestById(c, hbeParam("test")) || mine[0] || hbePrimaryTest(c);
  if(mine.length && !mine.filter(function(x){ return x.id === T.id; }).length){
    hbeToast("That assessment is not open for your department.", "alert");
    T = mine[0];
  }

  /* the paper comes from the tagged item bank (js/hb-analytics.js);
     ?practice=pm-0N runs a practice mock, ?practice=qp-… a one-question quick practice */
  var practice = HBX.PRACTICE.concat(HBX.QUICK).filter(function(p){ return p.testId === hbeParam("practice"); })[0];
  var bp = practice || HBX.paperFor(c, T);
  var hasCode = bp.questions.some(function(q){ return q.coding; });
  if(practice) T = { id: practice.testId, name: practice.testName,
    durationMin: hasCode ? 20 : Math.max(3, Math.ceil(practice.questions.length * 1.5)) };
  var paper = bp.questions;
  var answers = new Array(paper.length).fill(-1);
  var codes = paper.map(function(q){ return q.coding ? q.starter : null; });   /* coding answers */
  /* telemetry per question — becomes one `student_question_analytics` row each */
  var tel = paper.map(function(){ return { firstViewedAt:null, attemptedAt:null, ms:0, changes:0, visits:0 }; });
  var cur = 0, shownAt = Date.now();
  var total = (practice ? T.durationMin : Math.min(T.durationMin, Math.ceil(paper.length * 1.5))) * 60, tick;

  var lg = document.getElementById("lg");
  lg.src = c.logo;
  lg.style.maxHeight = (+c.logoHeight || 34) + "px";
  document.getElementById("tName").textContent = T.name;
  document.getElementById("tSub").textContent =
      st.name + " · " + st.regNo + " · " + paper.length + " questions";

  function leave(){
    var now = Date.now();
    tel[cur].ms += now - shownAt;
    shownAt = now;
  }
  function arrive(i){
    cur = i; shownAt = Date.now();
    var t = tel[i];
    t.visits++;
    if(!t.firstViewedAt) t.firstViewedAt = new Date().toISOString();
  }

  /* ---------------- render ---------------- */
  function draw(){
    var q = paper[cur];
    document.getElementById("qSec").textContent = q.sectionName;
    document.getElementById("qNum").textContent = "Question " + (cur+1) + " of " + paper.length + " · " + q.areaTitle;
    if(q.coding){
      document.getElementById("qText").textContent = q.title;
      document.getElementById("opts").innerHTML =
        '<p style="margin:-8px 0 14px">' + hbeEsc(q.text) + "</p>" +
        '<div class="ex">' + q.samples.map(function(s){ return hbeEsc(q.fn + "(" + s[0].map(function(a){ return JSON.stringify(a); }).join(", ") + ")") + "  \u2192  " + hbeEsc(JSON.stringify(s[1])); }).join("<br>") + "</div>" +
        '<div class="code-wrap"><div class="bar"><span>JavaScript</span><span>Hidden tests decide your marks</span></div>' +
        '<textarea id="code" spellcheck="false" oninput="T.code(this.value)">' + hbeEsc(codes[cur]) + "</textarea></div>" +
        '<div class="row" style="gap:10px;margin-top:12px"><button class="btn btn-soft btn-sm" onclick="T.run()">' + ico("rocket") + " Run sample tests</button>" +
        '<span class="xs mut">Prototype: answers are written in JavaScript. The live platform uses its own code engine.</span></div>' +
        '<div class="run-out" id="runOut"></div>';
      var ta = document.getElementById("code");
      ta.addEventListener("keydown", function(e){
        if(e.key === "Tab"){ e.preventDefault(); var s = ta.selectionStart; ta.value = ta.value.slice(0, s) + "  " + ta.value.slice(ta.selectionEnd); ta.selectionStart = ta.selectionEnd = s + 2; setCode(ta.value); }
      });
    } else {
      document.getElementById("qText").textContent = q.text;
      document.getElementById("opts").innerHTML = q.choices.map(function(o,i){
        return '<label class="opt'+(answers[cur]===i?" sel":"")+'" onclick="T.pick('+i+')">' +
               '<input type="radio" name="o" '+(answers[cur]===i?"checked":"")+'><span>'+hbeEsc(o)+"</span></label>"; }).join("");
    }

    var lastSec = null;
    document.getElementById("pal").innerHTML = paper.map(function(p,i){
      var head = p.sectionName !== lastSec ? '<div class="pal-sec">'+hbeEsc(p.sectionName)+"</div>" : "";
      lastSec = p.sectionName;
      return head + '<button class="pal'+(i===cur?" cur":(answers[i]>-1?" ans":""))+'" onclick="T.jump('+i+')">'+(i+1)+"</button>"; }).join("");

    var done = answers.filter(function(a){ return a>-1; }).length;
    document.getElementById("cAns").textContent = done;
    document.getElementById("cRem").textContent = paper.length - done;
  }

  function clock(){
    var m = Math.floor(total/60), sec = total%60;
    var el = document.getElementById("timer");
    el.innerHTML = ico("clock") + (m<10?"0":"") + m + ":" + (sec<10?"0":"") + sec;
    el.className = "timer" + (total <= 60 ? " low" : "");
    if(total <= 0){ clearInterval(tick); hbeToast("Time is up — submitting your test.","clock"); submit(true); return; }
    total--;
  }
  clock(); tick = setInterval(clock, 1000);

  /* ---------------- actions ---------------- */
  function pick(i){
    if(answers[cur] !== i){
      if(answers[cur] > -1) tel[cur].changes++;
      answers[cur] = i;
      tel[cur].attemptedAt = new Date().toISOString();
    }
    draw();
  }
  function jump(i){ leave(); arrive(i); draw(); }
  function go(d){
    var n = cur + d;
    if(n < 0 || n >= paper.length){ if(n>=paper.length) hbeToast("That was the last question. Submit when you are ready.","info"); return; }
    leave(); arrive(n); draw();
  }
  function clearAns(){
    answers[cur] = -1; tel[cur].attemptedAt = null;
    if(paper[cur].coding) codes[cur] = paper[cur].starter;
    draw();
  }

  /* ---------------- coding ---------------- */
  function setCode(v){
    codes[cur] = v;
    var written = v.trim() && v.trim() !== paper[cur].starter.trim();
    answers[cur] = written ? 0 : -1;
    if(written) tel[cur].attemptedAt = new Date().toISOString();
    document.getElementById("cAns").textContent = answers.filter(function(a){ return a>-1; }).length;
    document.getElementById("cRem").textContent = answers.filter(function(a){ return a===-1; }).length;
  }
  function run(){
    var out = document.getElementById("runOut");
    out.innerHTML = '<div class="run-row">Running…</div>';
    HBX.grade(paper[cur].questionId, codes[cur], "samples").then(function(res){
      if(res.error){ out.innerHTML = '<div class="run-row bad">' + hbeEsc(res.error) + "</div>"; return; }
      out.innerHTML = res.results.map(function(t){
        return '<div class="run-row ' + (t.ok ? "ok" : "bad") + '">' + (t.ok ? "\u2713" : "\u2717") + " " +
          hbeEsc(paper[cur].fn + "(" + t.input.map(function(a){ return JSON.stringify(a); }).join(", ") + ")") +
          " \u2192 " + hbeEsc(t.error ? "error: " + t.error : JSON.stringify(t.got)) + (t.ok ? "" : "  (expected " + hbeEsc(JSON.stringify(t.expected)) + ")") + "</div>";
      }).join("");
    });
  }

  function submit(auto){
    var done = answers.filter(function(a){ return a>-1; }).length;
    if(!auto && done < paper.length){
      if(!confirm((paper.length-done) + " question(s) are still unanswered. Submit anyway?")) return;
    }
    clearInterval(tick);
    leave();

    /* coding answers are graded against the hidden tests first */
    var graded = {};
    var jobs = paper.map(function(q, i){
      if(!q.coding || answers[i] === -1) return Promise.resolve();
      return HBX.grade(q.questionId, codes[i], "tests").then(function(res){
        var passed = res.results.filter(function(x){ return x.ok; }).length, total = q.tests.length;
        graded[i] = { passed: passed, total: total };
      });
    });
    if(hasCode) hbeToast("Running your code against the hidden tests…", "rocket", 4000);
    Promise.all(jobs).then(function(){ finish(graded); });
  }

  function finish(graded){
    /* one row per question, exactly the Elasticsearch `student_question_analytics` shape */
    var now = new Date().toISOString();
    var rows = paper.map(function(q, i){
      var t = tel[i], att = answers[i] > -1, ok = att && answers[i] === q.answer;
      var g = graded[i];
      var score = att ? (ok ? q.marks : -q.negative) : 0;
      if(q.coding){
        ok = !!g && g.passed === g.total;
        score = g ? Math.round(g.passed / g.total * q.marks * 10) / 10 : 0;   /* partial credit */
      }
      return {
        studentId: st.id, testId: T.id, testName: T.name,
        questionId: q.questionId, uniqueQno: q.uniqueQno, qno: q.qno,
        sectionId: q.sectionId, sectionName: q.sectionName,
        areaId: q.areaId, areaTitle: q.areaTitle, subAreaId: q.subAreaId, subAreaName: q.subAreaName,
        moduleId: bp.moduleId, moduleName: bp.moduleName, lod: q.lod, typeOfQues: q.typeOfQues, attemptType: "test",
        isAttempted: att, isCorrect: ok,
        score: score, questionMarks: q.marks,
        timeTaken: Math.max(1, Math.round(t.ms / 1000)),
        selectedAnswer: att && !q.coding ? "ABCDEFGH"[answers[i]] : null,
        firstViewedAt: t.firstViewedAt, attemptedAt: att ? t.attemptedAt : null,
        createdAt: t.firstViewedAt || now, updatedAt: now
      };
    });
    HBX.recordAttempt(rows);
    if(!practice){                                   /* campus assessments also keep the summary result */
      var result = HBX.resultFromRows(rows, T.id);
      hbeSaveResult(st.id, T.id, result);
    }
    location.href = "report.html?new=1&test=" + encodeURIComponent(T.id);
  }

  arrive(0);
  draw();
  return { pick:pick, jump:jump, go:go, clear:clearAns, submit:submit, code:setCode, run:run };
})();
</script>
</body>
</html>
