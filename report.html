<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Performance Report · Hitbullseye</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/polish.css">
<link rel="stylesheet" href="css/analytics.css">
<style>
  @media print{ .nav,.no-print{display:none!important} body{background:#fff} .card{box-shadow:none;border-color:#ddd} }
</style>
</head>
<body>

<div class="demo-strip"><b>DEMO PROTOTYPE</b> · not a live university portal · please do not enter real personal details</div>

<div id="nav"></div>

<main style="padding-bottom:60px">
  <div id="page"></div>

  <footer class="foot row-b no-print wrap">
    <span>© 2026 Hitbullseye · Campus Assessment Platform</span>
    <span>Report generated automatically from the student's attempt.</span>
  </footer>
</main>

<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/hb-engine.js"></script>
<script src="js/hb-analytics.js"></script>
<script src="js/hb-charts.js"></script>
<script src="js/hb-report.js"></script>
<script>
(function(){
  var s = hbeSession();
  if(!s){ location.href = "login.html?next=report.html"; return; }

  var qid = hbeParam("id");
  var st  = qid ? hbeStudentById(qid) : hbeStudentById(s.id);
  if(s.role === "student" && st && st.id !== s.id){ st = hbeStudentById(s.id); }   /* students only see their own */
  if(!st){ document.getElementById("page").innerHTML =
    '<div class="wrap" style="padding-top:30px"><div class="card center"><h2>Report not found</h2></div></div>'; return; }

  var cfg = hbeGetConfig();
  var c   = cfg.colleges[st.collegeId];
  hbeApplyTheme(c);

  var isAdmin = hbeIsAdminish(s);
  document.getElementById("nav").innerHTML = hbeNav(c,
    (isAdmin
      ? '<a class="nav-link" href="admin-analytics.html">Analytics</a>' +
        '<a class="nav-link" href="admin-reports.html">Students</a>' +
        '<a class="nav-link" href="admin-roster.html">Master list</a>'
      : '<a class="nav-link" href="dashboard.html">My dashboard</a>') +
    '<a class="nav-link on" href="#">Report</a>' +
    '<a class="btn btn-ghost btn-sm" href="#" onclick="hbeLogout();return false">'+ico("logout")+' Sign out</a>');

  function href(o){
    var q = [];
    if(isAdmin) q.push("id=" + encodeURIComponent(st.id));
    if(o.test) q.push("test=" + encodeURIComponent(o.test));
    if(o.view) q.push("view=" + o.view);
    return "report.html" + (q.length ? "?" + q.join("&") : "");
  }

  var data = HBX.dataFor(st.id);
  var rep  = HBA.buildStudentReport(data);
  var page = document.getElementById("page");

  /* ---- header band ---- */
  var band =
    '<header class="pband report-band"><div class="wrap pband-in">' +
      '<div class="row" style="gap:16px">' +
        '<div class="avatar pband-av">'+hbeInitials(st.name)+"</div>" +
        '<div><span class="eyebrow">Performance report</span>' +
          '<h1 style="font-size:28px;margin-top:10px">'+hbeEsc(st.name)+"</h1>" +
          '<p class="sm">'+hbeEsc(st.regNo)+" · "+hbeEsc(c.name)+(st.course ? " · "+hbeEsc(st.course) : "")+"</p></div>" +
      "</div>" +
      '<div class="pband-side no-print">' +
        (isAdmin ? '<a class="btn btn-line btn-sm" href="admin-reports.html">'+ico("back")+" All students</a>" : "") +
        '<button class="btn btn-line btn-sm" onclick="window.print()">'+ico("file")+" Download / print</button>" +
      "</div>" +
    "</div></header>";

  var practiceIds = rep.practice.map(function(t){ return t.testId; });
  if(rep.mode === "empty" && !rep.practice.length){
    page.innerHTML = band + '<div class="wrap pband-stats"><div class="card center an-empty">' +
      '<div class="f-ico" style="margin:0 auto;background:var(--warn-bg);color:var(--warn)">' + ico("alert") + "</div>" +
      '<h2 style="margin-top:14px">No attempt yet</h2>' +
      '<p class="mut" style="margin-top:8px">'+hbeEsc(st.name)+' has not attempted any assessment so far. The report is built the moment a test is submitted.</p>' +
      (isAdmin ? '<a class="btn btn-ghost mt" href="admin-reports.html">Back to all students</a>'
               : '<a class="btn mt" href="dashboard.html">Go to my assessments</a>') + "</div></div>";
    return;
  }

  /* ---- which view? ---- */
  var wanted = hbeParam("test"), view = hbeParam("view");
  var testIds = rep.tests.map(function(t){ return t.testId; });
  var microId = wanted && practiceIds.indexOf(wanted) > -1 ? wanted : null;
  /* landing page = the analytics overview, unless a test or the progress view was asked for */
  var showOverview = !wanted && view !== "progress" && view !== "test";
  var showProgress = !showOverview && !microId && rep.mode === "journey" && (view === "progress" || (!wanted && view !== "test"));
  if(!showOverview && !microId && !testIds.length) microId = practiceIds[practiceIds.length - 1];
  var testId = wanted && testIds.indexOf(wanted) > -1 ? wanted : testIds[testIds.length - 1];

  /* ---- top bar: Overview · Progress · one dropdown for every test and quick practice ---- */
  var curId = microId || (!showOverview && !showProgress ? testId : "");
  var opt = function(t, label){
    return '<option value="' + hbeEsc(t.testId) + '"' + (t.testId === curId ? " selected" : "") + ">" + hbeEsc(label) + "</option>";
  };
  var tabs = '<nav class="an-topbar no-print" aria-label="Reports">' +
    '<a class="an-tab' + (showOverview ? " on" : "") + '" href="' + href({}) + '">' + ico("grid") + "Overview</a>" +
    (rep.mode === "journey" ? '<a class="an-tab' + (showProgress ? " on" : "") + '" href="' + href({ view:"progress" }) + '">' + ico("chart") + "Progress<span>" + rep.tests.length + " tests</span></a>" : "") +
    '<label class="an-pick' + (curId ? " on" : "") + '">' + ico("file") +
      '<select id="testPick" aria-label="Open a test report"><option value="">' + (curId ? "Switch test…" : "Open a test report…") + "</option>" +
      (rep.tests.length ? '<optgroup label="Tests">' + rep.tests.slice().reverse().map(function(t){
        return opt(t, t.testName.replace(/\u2014.*$/, "").trim() + "  ·  " + Math.round(t.scorePct * 100) + "%");
      }).join("") + "</optgroup>" : "") +
      (rep.practice.length ? '<optgroup label="Quick practice">' + rep.practice.slice().reverse().map(function(t){
        return opt(t, t.testName + "  ·  " + (t.scorePct >= 1 ? "right" : Math.round(t.scorePct * 100) + "%"));
      }).join("") + "</optgroup>" : "") +
      "</select></label>" +
    "</nav>";

  /* a single real attempt: offer to simulate a practice journey to show the progress view */
  var simOffer = (!isAdmin && !microId && !showOverview && rep.mode === "single" && !HBX.hasSimulatedJourney(st.id))
    ? '<div class="an-sim no-print mt"><div class="grow"><b>One test so far.</b> <span class="sm mut">Your progress report appears after your second test. ' +
      'Want to preview it? We can simulate 5 practice mocks starting from your level.</span></div>' +
      '<button class="btn btn-sm" id="simj">' + ico("chart") + " Simulate my journey</button></div>"
    : "";

  /* everything below comes from the analytics indexes only */
  var ctx = {
    st: st, data: data, college: c, href: href,
    rank: function(tid, score){ return HBX.rankOf(tid, score); },   /* student_test_analytics_v2.totalScore */
    key: function(tid){ return HBX.answerKey(tid); },                /* student_question_analytics: isCorrect + selectedAnswer */
    /* from the host platform, not analytics: names for the toppers list, support email, and which tests are open */
    nameOf: function(id){ var x = hbeStudentById(id); return x ? x.name : null; },
    support: cfg.brand.supportEmail || "",
    catalogue: { "Assessments": hbeTestsFor(c, st).length, "Placement Practice Series": HBX.PRACTICE.length, "Quick practice": HBX.QUICK.length }
  };
  var v = showOverview ? HBR.overviewView(ctx, rep.overview)
        : microId ? HBR.questionView(ctx, HBA.buildMicroReport(data, microId))
        : showProgress ? HBR.progressView(ctx, rep.journey) : HBR.testView(ctx, HBA.buildTestReport(data, testId));

  function paint(){
    page.innerHTML = band + '<div class="wrap pband-stats">' + tabs + simOffer + v.html + "</div>";
    v.after(page);
    var pick = document.getElementById("testPick");
    if(pick) pick.addEventListener("change", function(){ if(pick.value) location.href = href({ test: pick.value }); });
    var sj = document.getElementById("simj");
    if(sj) sj.addEventListener("click", function(){ HBX.simulateJourney(st.id); location.href = href({ view:"progress" }); });
  }

  if(hbeParam("new")){
    var w = HBX.world(), r = microId ? HBA.buildMicroReport(data, microId) : HBA.buildTestReport(data, testId);
    var peers = (w.idx.student_test_analytics_v2.get(microId || testId) || []).length;
    HBR.analysing({ questions: r ? r.questions.length : 0, rows: w.rows.length, students: w.idx.student_analytics_v2.size, peers: peers }, function(){
      paint();
      hbeToast("Your report is ready. Well done on completing the test!", "check", 6000);
    });
  } else paint();
})();
</script>
</body>
</html>
